# /etc/nginx/sites-available/promasidor  (puis : ln -s ../sites-available/promasidor /etc/nginx/sites-enabled/)
# Certificat : sudo certbot --nginx -d promasidor-dz.com -d www.promasidor-dz.com

limit_req_zone $binary_remote_addr zone=promasidor_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=promasidor_all:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name promasidor-dz.com www.promasidor-dz.com;
    return 301 https://www.promasidor-dz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.promasidor-dz.com;

    # ssl_certificate / ssl_certificate_key : ajoutés automatiquement par certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=promasidor_all burst=40 nodelay;

    # Fichiers sensibles : jamais servis, même par erreur
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* ^/(server|deploy|node_modules)(/|$) { return 404; }

    # Formulaire public : limitation supplémentaire
    location = /api/partenaires {
        limit_req zone=promasidor_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/promasidor-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/promasidor-proxy.conf;
    }
}
